<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Register Complaint</title>
  <link rel='stylesheet' href='css/style.css'>
  <script src='js/config.js'></script>
  <script src='js/demoData.js'></script>
  <script src='js/api.js'></script>
  <script src='js/complaints.js' defer></script>
</head>
<body>
  <div class='sidebar'>
    <h2>WaterMgmt</h2>
    <ul>
      <li><a href='index.html'>Dashboard</a></li>
      <li><a href='resources.html'>Resources</a></li>
      <li><a href='consumption.html'>Consumption</a></li>
      <li><a href='complaints.html' class='active'>Complaints</a></li>
      <li><a href='tracking.html'>Tracking</a></li>
      <li><a href='maintenance.html'>Maintenance</a></li>
    </ul>
  </div>
  <div class='main'>
    <div class='header'>
      <h1>Register Complaint</h1>
      <span class='menu-toggle' onclick='toggleSidebar()'>?</span>
    </div>
    <div class='content'>
      <form id='complaintForm' class='card'>
        <h2>Complaint Form</h2>
        <div>
          <label for='name'>Citizen Name *</label><br>
          <input type='text' id='name' name='name' required />
        </div>
        <div>
          <label for='contact'>Contact *</label><br>
          <input type='text' id='contact' name='contact' required />
        </div>
        <div>
          <label for='location'>Location *</label><br>
          <input type='text' id='location' name='location' required />
        </div>
        <div>
          <label for='category'>Category *</label><br>
          <select id='category' name='category' required>
            <option value=''>Select</option>
            <option>Leak</option>
            <option>Contamination</option>
            <option>Infrastructure Damage</option>
          </select>
        </div>
        <div>
          <label for='priority'>Priority *</label><br>
          <select id='priority' name='priority' required>
            <option value=''>Select</option>
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
          </select>
        </div>
        <div>
          <label for='description'>Description *</label><br>
          <textarea id='description' name='description' rows='4' required></textarea>
        </div>
        <div style='margin-top:15px;'>
          <button type='submit' class='btn' id='submitBtn'>Submit</button>
          <span id='statusMsg' style='margin-left:10px;'></span>
        </div>
        <p id='demoIndicator' style='color:var(--accent-color);font-size:0.9rem;margin-top:10px;display:none;'>Demo mode – data not persisted.</p>
      </form>
    </div>
  </div>
  <script>
    function toggleSidebar(){
      document.querySelector('.sidebar').classList.toggle('open');
    }
  </script>
</body>
</html>
