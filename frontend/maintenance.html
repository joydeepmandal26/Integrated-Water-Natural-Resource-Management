<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Maintenance Schedule</title>
  <link rel='stylesheet' href='css/style.css'>
  <script src='js/config.js'></script>
  <script src='js/demoData.js?v=7'></script>
  <script src='js/api.js?v=7'></script>
  <script src='js/maintenance.js?v=2' defer></script>
</head>
<body>
  <div class='sidebar'>
    <h2>WaterMgmt</h2>
    <ul>
      <li><a href='index.html'>Dashboard</a></li>
      <li><a href='resources.html'>Resources</a></li>
      <li><a href='consumption.html'>Consumption</a></li>
      <li><a href='complaints.html'>Complaints</a></li>
      <li><a href='tracking.html'>Tracking</a></li>
      <li><a href='maintenance.html' class='active'>Maintenance</a></li>
    </ul>
  </div>
  <div class='main'>
    <div class='header'>
      <h1>Maintenance Schedule</h1>
      <span class='menu-toggle' onclick='toggleSidebar()'>☰</span>
    </div>
    <div class='content'>
      <button class='btn' id='addMaintenanceBtn'>Add Maintenance</button>
      <div class='table-container' style='margin-top:20px;'>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Description</th>
              <th>Location</th>
              <th>Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id='maintenanceTableBody'>
            <tr><td colspan='6'>Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <script>
    function toggleSidebar(){
      document.querySelector('.sidebar').classList.toggle('open');
    }
  </script>
