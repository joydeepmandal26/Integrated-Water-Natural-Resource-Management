server:
  port: 8081

spring:
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes:
        - id: resources
          uri: http://localhost:8082
          predicates:
            - Path=/api/resources/**
        - id: consumption
          uri: http://localhost:8082
          predicates:
            - Path=/api/consumption/**
        - id: complaints
          uri: http://localhost:8082
          predicates:
            - Path=/api/complaints/**
        - id: maintenance
          uri: http://localhost:8082
          predicates:
            - Path=/api/maintenance/**
        - id: frontend
          uri: http://localhost:8080
          predicates:
            - Path=/**